syntax = "proto3";

package crm.interactions;

option go_package = "github.com/ultra-erp/crm/grpc/interactions";

import "common.proto";

message NoteResponse { string json = 1; }
message TaskResponse { string json = 1; }
message CallResponse { string json = 1; }

message CreateNoteRequest {
  string tenant_id = 1; string content = 2; string author_user_id = 3;
  optional string contact_id = 4; optional string company_id = 5; optional string deal_id = 6;
}

message UpdateNoteRequest {
  string tenant_id = 1; string id = 2; optional string content = 3;
  optional string contact_id = 4; optional string company_id = 5; optional string deal_id = 6;
}

message ListNotesRequest {
  string tenant_id = 1; optional string contact_id = 2; optional string company_id = 3;
  optional string deal_id = 4; optional string author_user_id = 5;
  optional string cursor = 6; optional int32 limit = 7;
}

message CreateTaskRequest {
  string tenant_id = 1; string title = 2; string due_date = 3; string assigned_user_id = 4;
  optional string contact_id = 5; optional string company_id = 6; optional string deal_id = 7;
  optional string description = 8; optional bool is_completed = 9;
}

message UpdateTaskRequest {
  string tenant_id = 1; string id = 2; optional string title = 3; optional string description = 4;
  optional string due_date = 5; optional bool is_completed = 6;
  optional string contact_id = 7; optional string company_id = 8; optional string deal_id = 9;
  optional string assigned_user_id = 10;
}

message ListTasksRequest {
  string tenant_id = 1; optional string assigned_user_id = 2; optional bool is_completed = 3;
  optional string contact_id = 4; optional string cursor = 5; optional int32 limit = 6;
}

message CreateCallRequest {
  string tenant_id = 1; string call_type = 2; string happened_at = 3; string author_user_id = 4;
  optional string contact_id = 5; optional int32 duration_seconds = 6; optional string summary = 7;
}

message ListCallsRequest {
  string tenant_id = 1; optional string contact_id = 2; optional string call_type = 3;
  optional string cursor = 4; optional int32 limit = 5;
}

service InteractionService {
  rpc CreateNote(CreateNoteRequest) returns (NoteResponse);
  rpc GetNote(crm.common.IdRequest) returns (NoteResponse);
  rpc ListNotes(ListNotesRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (crm.common.Empty);
  rpc DeleteNote(crm.common.IdRequest) returns (crm.common.Empty);
  rpc CreateTask(CreateTaskRequest) returns (TaskResponse);
  rpc GetTask(crm.common.IdRequest) returns (TaskResponse);
  rpc ListTasks(ListTasksRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (crm.common.Empty);
  rpc DeleteTask(crm.common.IdRequest) returns (crm.common.Empty);
  rpc CreateCall(CreateCallRequest) returns (CallResponse);
  rpc GetCall(crm.common.IdRequest) returns (CallResponse);
  rpc ListCalls(ListCallsRequest) returns (crm.common.PaginatedResponse);
}
