syntax = "proto3";

package crm.notifications;

option go_package = "github.com/ultra-erp/crm/grpc/notifications";

import "common.proto";

// NotificationChannel
message ChannelResponse { string json = 1; }
message CreateChannelRequest {
  optional string tenant_id = 1;
  string channel_type = 2;
  string provider_type = 3;
  string name = 4;
  optional string config_json = 5;
}
message UpdateChannelRequest {
  string id = 1;
  optional string tenant_id = 2;
  optional string name = 3;
  optional string config_json = 4;
  optional bool is_active = 5;
}
message ListChannelsRequest { optional string tenant_id = 1; }

// NotificationTemplate
message TemplateResponse { string json = 1; }
message CreateTemplateRequest {
  optional string tenant_id = 1;
  string channel_type = 2;
  string template_key = 3;
  string subject_template = 4;
  string body_template = 5;
  repeated string variables = 6;
  optional string locale = 7;
}
message UpdateTemplateRequest {
  string id = 1;
  optional string tenant_id = 2;
  optional string subject_template = 3;
  optional string body_template = 4;
  repeated string variables = 5;
  optional string locale = 6;
}
message ListTemplatesRequest { optional string tenant_id = 1; }
message RenderTemplateRequest {
  string template_id = 1;
  string variables_json = 2;
}

// Send / Queue
message SendTransientEmailRequest {
  string tenant_id = 1;
  string to = 2;
  string subject = 3;
  string body = 4;
  optional bool is_html = 5;
}

message SendEmailRequest {
  optional string tenant_id = 1;
  string to = 2;
  string subject = 3;
  string body = 4;
  optional bool is_html = 5;
  optional string channel_id = 6;
}
message SendPushRequest {
  optional string tenant_id = 1;
  string device_token = 2;
  string title = 3;
  string body = 4;
  optional string data_json = 5;
  optional string channel_id = 6;
}
message EnqueueNotificationRequest {
  optional string tenant_id = 1;
  string channel_type = 2;
  optional string channel_id = 3;
  optional string template_id = 4;
  string to_address = 5;
  optional string subject = 6;
  optional string body = 7;
  optional string variables_json = 8;
  optional int32 priority = 9;
  optional string scheduled_at = 10;
}
message EnqueueNotificationResponse { string json = 1; }
message ListNotificationsRequest {
  optional string tenant_id = 1;
  optional string status = 2;
  optional string channel_type = 3;
  optional string cursor = 4;
  optional int32 limit = 5;
}
message CancelNotificationRequest { string id = 1; optional string tenant_id = 2; }

// Logs
message ListLogsRequest {
  optional string tenant_id = 1;
  optional string channel_type = 2;
  optional string cursor = 3;
  optional int32 limit = 4;
}

// Preferences
message GetPreferencesRequest { string user_id = 1; optional string tenant_id = 2; }
message SetPreferencesRequest {
  string user_id = 1;
  optional string tenant_id = 2;
  string channel_type = 3;
  bool is_enabled = 4;
}
message PreferencesResponse { string json = 1; }

service NotificationService {
  // Channels
  rpc CreateChannel(CreateChannelRequest) returns (ChannelResponse);
  rpc GetChannel(crm.common.IdRequest) returns (ChannelResponse);
  rpc ListChannels(ListChannelsRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (crm.common.Empty);
  rpc DeleteChannel(crm.common.IdRequest) returns (crm.common.Empty);

  // Templates
  rpc CreateTemplate(CreateTemplateRequest) returns (TemplateResponse);
  rpc GetTemplate(crm.common.IdRequest) returns (TemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (crm.common.Empty);
  rpc DeleteTemplate(crm.common.IdRequest) returns (crm.common.Empty);
  rpc RenderTemplate(RenderTemplateRequest) returns (TemplateResponse);

  // Send / Queue
  rpc SendEmail(SendEmailRequest) returns (EnqueueNotificationResponse);
  rpc SendTransientEmail(SendTransientEmailRequest) returns (EnqueueNotificationResponse);
  rpc SendPush(SendPushRequest) returns (EnqueueNotificationResponse);
  rpc EnqueueNotification(EnqueueNotificationRequest) returns (EnqueueNotificationResponse);
  rpc GetNotification(crm.common.IdRequest) returns (EnqueueNotificationResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (crm.common.PaginatedResponse);
  rpc CancelNotification(CancelNotificationRequest) returns (crm.common.Empty);

  // Logs
  rpc ListLogs(ListLogsRequest) returns (crm.common.PaginatedResponse);

  // Preferences
  rpc GetPreferences(GetPreferencesRequest) returns (PreferencesResponse);
  rpc SetPreferences(SetPreferencesRequest) returns (crm.common.Empty);
}
