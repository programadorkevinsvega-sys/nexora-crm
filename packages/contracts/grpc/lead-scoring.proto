syntax = "proto3";

package crm.lead_scoring;

import "common.proto";

message LeadScoreResponse {
  string json = 1;
}

message ScoringRuleResponse {
  string json = 1;
}

message CreateScoringRuleRequest {
  string tenant_id = 1;
  string name = 2;
  optional string description = 3;
  string category = 4;
  string condition_json = 5;
  int32 points = 6;
  optional int32 decay_days = 7;
  optional int32 decay_points = 8;
  optional bool is_active = 9;
}

message RecalculateScoreRequest {
  string tenant_id = 1;
  string contact_id = 2;
  string contact_context_json = 3;
}

message AdjustScoreRequest {
  string tenant_id = 1;
  string contact_id = 2;
  int32 points = 3;
  string reason = 4;
  optional string rule_id = 5;
}

message ApplyDecayRequest {
  string tenant_id = 1;
  string contact_id = 2;
  int32 days_without_activity = 3;
}

message ListTopLeadsRequest {
  string tenant_id = 1;
  optional int32 limit = 2;
}

service LeadScoringService {
  rpc CreateScoringRule(CreateScoringRuleRequest) returns (ScoringRuleResponse);
  rpc ToggleRuleStatus(crm.common.IdRequest) returns (ScoringRuleResponse);
  rpc ListScoringRules(crm.common.TenantRequest) returns (crm.common.PaginatedResponse);
  rpc GetLeadScore(crm.common.IdRequest) returns (LeadScoreResponse);
  rpc RecalculateLeadScore(RecalculateScoreRequest) returns (LeadScoreResponse);
  rpc AdjustLeadScore(AdjustScoreRequest) returns (LeadScoreResponse);
  rpc ApplyScoreDecay(ApplyDecayRequest) returns (LeadScoreResponse);
  rpc ListTopLeads(ListTopLeadsRequest) returns (crm.common.PaginatedResponse);
}
