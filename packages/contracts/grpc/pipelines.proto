syntax = "proto3";

package crm.pipelines;

option go_package = "github.com/ultra-erp/crm/grpc/pipelines";

import "common.proto";

message PipelineResponse { string json = 1; }
message PipelineStageResponse { string json = 1; }
message DealResponse { string json = 1; }
message PipelineBoardResponse { string json = 1; }

message CreatePipelineRequest {
  string tenant_id = 1;
  string name = 2;
}

message UpdatePipelineRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
}

message CreateStageRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string name = 3;
  int32 display_order = 4;
  optional int32 probability_percent = 5;
}

message ReorderStagesRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  repeated string stage_ids = 3;
}

message ListDealsRequest {
  string tenant_id = 1;
  optional string pipeline_id = 2;
  optional string stage_id = 3;
  optional string status = 4;
  optional string contact_id = 5;
  optional string company_id = 6;
  optional string assigned_user_id = 7;
  optional string search = 8;
  optional string cursor = 9;
  optional int32 limit = 10;
}

message CreateDealRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string stage_id = 3;
  optional string contact_id = 4;
  optional string company_id = 5;
  string name = 6;
  optional double amount = 7;
  optional string expected_close_date = 8;
  optional string assigned_user_id = 9;
}

message UpdateDealRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional double amount = 4;
  optional string stage_id = 5;
  optional string expected_close_date = 6;
  optional string assigned_user_id = 7;
}

message MoveDealRequest {
  string tenant_id = 1;
  string id = 2;
  string stage_id = 3;
}

message WinDealRequest {
  string tenant_id = 1;
  string id = 2;
  optional double amount = 3;
}

message LoseDealRequest {
  string tenant_id = 1;
  string id = 2;
  optional string lost_reason_id = 3;
  optional string lost_notes = 4;
}

service PipelineService {
  rpc CreatePipeline(CreatePipelineRequest) returns (PipelineResponse);
  rpc ListPipelines(crm.common.TenantRequest) returns (crm.common.PaginatedResponse);
  rpc GetPipelineBoard(crm.common.IdRequest) returns (PipelineBoardResponse);
  rpc UpdatePipeline(UpdatePipelineRequest) returns (crm.common.Empty);
  rpc DeletePipeline(crm.common.IdRequest) returns (crm.common.Empty);
  rpc CreateStage(CreateStageRequest) returns (PipelineStageResponse);
  rpc ReorderStages(ReorderStagesRequest) returns (crm.common.ListResponse);
  rpc CreateDeal(CreateDealRequest) returns (DealResponse);
  rpc GetDeal(crm.common.IdRequest) returns (DealResponse);
  rpc ListDeals(ListDealsRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateDeal(UpdateDealRequest) returns (crm.common.Empty);
  rpc MoveDeal(MoveDealRequest) returns (DealResponse);
  rpc WinDeal(WinDealRequest) returns (DealResponse);
  rpc LoseDeal(LoseDealRequest) returns (DealResponse);
  rpc DeleteDeal(crm.common.IdRequest) returns (crm.common.Empty);
}
