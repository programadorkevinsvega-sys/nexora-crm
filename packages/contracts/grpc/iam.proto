syntax = "proto3";

package crm.iam;

option go_package = "github.com/ultra-erp/crm/grpc/iam";

import "common.proto";

message RoleResponse { string json = 1; }
message PermissionResponse { string json = 1; }

message CreateRoleRequest {
  string tenant_id = 1;
  string name = 2;
  optional string description = 3;
  optional bool is_system_role = 4;
}

message UpdateRoleRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional string description = 4;
}

message ListRolesRequest {
  string tenant_id = 1;
  optional string search = 2;
  optional string cursor = 3;
  optional int32 limit = 4;
}

message CreatePermissionRequest {
  string module = 1;
  string action = 2;
  optional string description = 3;
}

message ListPermissionsRequest {
  optional string module = 1;
}

message AssignPermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message RemovePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message AssignRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
  optional string branch_id = 4;
}

message RemoveRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message ReplaceUserRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
  optional string branch_id = 4;
}

message ListUserRolesRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ListRolePermissionsRequest {
  string role_id = 1;
}

message CheckPermissionRequest {
  string tenant_id = 1;
  string user_id = 2;
  string module = 3;
  string action = 4;
  optional string branch_id = 5;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message UserRolesResponse {
  repeated string json_items = 1;
}

service IamService {
  // Roles
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc GetRole(crm.common.IdRequest) returns (RoleResponse);
  rpc ListRoles(ListRolesRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (crm.common.Empty);
  rpc DeleteRole(crm.common.IdRequest) returns (crm.common.Empty);

  // Permissions
  rpc CreatePermission(CreatePermissionRequest) returns (PermissionResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (crm.common.PaginatedResponse);

  // Role-Permission assignment
  rpc AssignPermission(AssignPermissionRequest) returns (crm.common.Empty);
  rpc RemovePermission(RemovePermissionRequest) returns (crm.common.Empty);
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (crm.common.PaginatedResponse);

  // User-Role assignment
  rpc AssignRole(AssignRoleRequest) returns (crm.common.Empty);
  rpc RemoveRole(RemoveRoleRequest) returns (crm.common.Empty);
  rpc ReplaceUserRole(ReplaceUserRoleRequest) returns (crm.common.Empty);
  rpc ListUserRoles(ListUserRolesRequest) returns (UserRolesResponse);

  // Policy evaluation
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUserPermissions(ListUserRolesRequest) returns (crm.common.PaginatedResponse);
}
