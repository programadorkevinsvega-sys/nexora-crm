syntax = "proto3";
package crm.social_inbox;
import "common.proto";

message SocialInboxResponse {
  string json = 1;
}

message ListCommentsRequest {
  string tenant_id = 1;
  optional string platform = 2;
  optional string status = 3;
}

message ListCommentsResponse {
  repeated string json_items = 1;
}

message ReplyCommentRequest {
  string tenant_id = 1;
  string comment_id = 2;
  string reply_message = 3;
  string replied_by = 4;
}

message UpdateCommentBotRequest {
  string tenant_id = 1;
  string comment_id = 2;
  string reply_message = 3;
  string replied_by = 4;
  string replied_at = 5;
}

message ListRulesRequest {
  string tenant_id = 1;
}

message ListRulesResponse {
  repeated string json_items = 1;
}

message DeleteRuleRequest {
  string tenant_id = 1;
  string rule_id = 2;
}

message GetEnabledRulesRequest {
  string tenant_id = 1;
  string platform = 2;
}

message AutoCreateContactRequest {
  string tenant_id = 1;
  string name = 2;
  string platform = 3;
  string author_id = 4;
}

service SocialInboxService {
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc ReplyComment(ReplyCommentRequest) returns (SocialInboxResponse);
  rpc InsertComment(crm.common.JsonRequest) returns (SocialInboxResponse);
  rpc UpdateCommentBot(UpdateCommentBotRequest) returns (SocialInboxResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc SaveRule(crm.common.JsonRequest) returns (SocialInboxResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (crm.common.Empty);
  rpc GetEnabledRulesForPlatform(GetEnabledRulesRequest) returns (ListRulesResponse);
  rpc AutoCreateContact(AutoCreateContactRequest) returns (SocialInboxResponse);
}
