syntax = "proto3";

package crm.analytics;

import "common.proto";

message RevenueMetricsResponse {
  string json = 1;
}

message FunnelMetricsResponse {
  string json = 1;
}

message CohortMetricsResponse {
  string json = 1;
}

message ForecastMetricsResponse {
  string json = 1;
}

message ForecastRequest {
  string tenant_id = 1;
  optional string horizon = 2;
}

service AnalyticsService {
  rpc GetRevenueMetrics(crm.common.TenantRequest) returns (RevenueMetricsResponse);
  rpc GetFunnelMetrics(crm.common.TenantRequest) returns (FunnelMetricsResponse);
  rpc GetCohortMetrics(crm.common.TenantRequest) returns (CohortMetricsResponse);
  rpc GetForecast(ForecastRequest) returns (ForecastMetricsResponse);
}
