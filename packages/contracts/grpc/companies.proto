syntax = "proto3";

package crm.companies;

option go_package = "github.com/ultra-erp/crm/grpc/companies";

import "common.proto";

message CompanyResponse {
  string json = 1;  // JSON-serialized Company
}

message CreateCompanyRequest {
  string tenant_id = 1;
  string name = 2;
  optional string tax_id = 3;
  optional string website = 4;
  optional string industry = 5;
  optional int32 number_of_employees = 6;
  optional double annual_revenue = 7;
  optional string description = 8;
  optional string parent_company_id = 9;
}

message UpdateCompanyRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional string tax_id = 4;
  optional string website = 5;
  optional string industry = 6;
  optional int32 number_of_employees = 7;
  optional double annual_revenue = 8;
  optional string description = 9;
  optional string parent_company_id = 10;
}

message ListCompaniesRequest {
  string tenant_id = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
  optional string search = 4;
  optional string industry = 5;
}

service CompanyService {
  rpc CreateCompany(CreateCompanyRequest) returns (CompanyResponse);
  rpc GetCompany(crm.common.IdRequest) returns (CompanyResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (crm.common.PaginatedResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (crm.common.Empty);
  rpc DeleteCompany(crm.common.IdRequest) returns (crm.common.Empty);
}
