name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-backend:
    name: Validate Backend & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Lint Workspace
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build All Backend Services
        run: pnpm build

  validate-frontend:
    name: Validate Frontend Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npx next build
