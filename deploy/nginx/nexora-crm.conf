# ==============================================================================
# Nexora CRM — Nginx Production Reverse Proxy Configuration
# ==============================================================================

# Zonas de Rate Limiting para mitigar ataques DDoS y fuerza bruta
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream definitions
upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream bff_gateway {
    server 127.0.0.1:3006;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 158.23.60.68 _;

    # Tamaño máximo para subida de archivos (Knowledge Base / Archivos Adjuntos)
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # --------------------------------------------------------------------------
    # Cabeceras de Seguridad Globales (OWASP Security Best Practices)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Reglas Estrictas de Seguridad: Bloqueo de Rutas Peligrosas y Archivos Críticos
    # --------------------------------------------------------------------------

    # 1. Bloquear acceso a archivos ocultos y directorios (.env, .git, .env.local, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Bloquear extensiones de archivos sensibles (.pem, .key, .sql, .sh, .log, .bak, .yml)
    location ~* \.(pem|key|crt|sql|sh|bash|bak|config|conf|log|yaml|yml|md|tsbuildinfo)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Bloquear rutas de escaneo comunes de bots maliciosos (WordPress, PHP, phpMyAdmin, etc.)
    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|\.well-known/security\.txt/.*) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Compresión Gzip para optimizar transferencia
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # --------------------------------------------------------------------------
    # BFF API Gateway (Backend-For-Frontend en Puerto 3006)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://bff_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Headers reales de cliente para auditoría y multi-tenancy
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de proxy para llamadas a integraciones
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate limit estricto para autenticación en BFF (/api/auth/*)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://bff_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Next.js Frontend (Puerto 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache agresivo para estáticos de Next.js (_next/static)
    location /_next/static/ {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
